name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- NOTIFIKASI AWAL MULAI BUILD ---
      - name: Send Start Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TOKEN_BOT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: 'app_release.yml'
        run: python send_telegram_start.py

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Send Release APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TOKEN_BOT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_telegram_release.py

      - name: Send Failure Log to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TOKEN_BOT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<EOF
          import os, requests
          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          caption = (
              f"❌ <b>RELEASE BUILD FAILED!</b>\n\n"
              f"<b>Repo:</b> {os.environ['GITHUB_REPOSITORY']}\n"
              f"<b>Branch:</b> <code>{os.environ['GITHUB_REF_NAME']}</code>\n"
              f"<b>Commit:</b> <code>{os.environ['GITHUB_SHA'][:7]}</code>\n"
              f"<b>Author:</b> {os.environ['GITHUB_ACTOR']}"
          )
          with open("build.log", "rb") as log:
              requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendDocument",
                  data={"chat_id": chat_id, "caption": caption, "parse_mode": "HTML"},
                  files={"document": log}
              )
          EOF