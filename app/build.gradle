plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worm.io'
    compileSdk 34

    defaultConfig {
        applicationId 'com.worm.io'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -fexceptions'
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Tetap 0 library / tanpa androidx
}